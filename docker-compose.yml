version: "3.8"

services:
  mysql-db:
    image: mysql:8
    container_name: mysql-wallet
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: wallet_db
      MYSQL_USER: wallet_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:  # ✅ Ensures MySQL is ready before starting wallet-service
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "wallet_user", "-ppassword"]
      interval: 5s
      timeout: 10s
      retries: 10

  wallet-service:
    build: .
    container_name: wallet-api
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy  # ✅ Ensures MySQL is fully initialized
    environment:
      NODE_ENV: production
      DB_HOST: mysql-db  # ✅ Use MySQL service name instead of localhost
      DB_USER: wallet_user
      DB_PASSWORD: password
      DB_NAME: wallet_db
      DB_DIALECT: mysql
      DB_PORT: 3306
      PORT: 5000
    ports:
      - "5000:5000"
    working_dir: /app
    command: ["sh", "-c", "sleep 15 && npm run deploy"]  # ✅ Delay app startup to wait for MySQL
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
